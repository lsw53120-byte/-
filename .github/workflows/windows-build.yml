name: Windows distribution build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: py -m pip install -r requirements.txt
      - name: Run tests
        run: py -m unittest discover -s tests -v
      - name: Build buyer package
        shell: cmd
        run: call build_release.bat
      - name: Reject private runtime files
        shell: pwsh
        run: |
          $zip = "release/SearchConsoleHelper_Windows.zip"
          $names = tar -tf $zip
          $forbidden = $names | Where-Object { $_ -match '(token|client_secret|history\.(db|sqlite)|settings\.json|app_config|loop-review|chrome_profile|indexed_history)' }
          if ($forbidden) { throw "Private runtime files found: $($forbidden -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: SearchConsoleHelper-Windows
          path: release/SearchConsoleHelper_Windows.zip
          if-no-files-found: error
